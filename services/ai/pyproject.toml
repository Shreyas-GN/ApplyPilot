[project]
name = "applypilot-ai"
version = "0.0.0"
description = "ApplyPilot AI service — resume parsing, matching, and tailoring pipelines (docs/AI_AGENTS.md)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
